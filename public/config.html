<body>
  <h1>Configurações do Site</h1>
  <div class="config-container">
    <div class="config-item">
      <label for="modo">Modo:</label>
      <select id="modo">
        <option value="claro">Claro</option>
        <option value="escuro">Escuro</option>
      </select>
    </div>

    <div class="config-item">
      <label for="fonte">Fonte:</label>
      <select id="fonte">
        <option value="Arial">Arial</option>
        <option value="Verdana">Verdana</option>
        <option value="Tahoma">Tahoma</option>
        <option value="Georgia">Georgia</option>
        <option value="Courier New">Courier New</option>
      </select>
    </div>

    <div class="config-item">
      <label for="tamanhoFonte">Tamanho da Fonte: <span id="tamanhoFonteVal">15</span> </label>
      <input type="range" id="tamanhoFonte" min="10" max="30" value="15" />
    </div>

    <div class="config-item">
      <label for="brilho">Brilho: <span id="brilhoVal">100</span></label>
      <input type="range" id="brilho" min="50" max="150" value="100" />
    </div>

    <div class="config-item">
      <label for="corPrimaria">Cor Primária:</label>
      <input type="color" id="corPrimaria" value="#0078d7" />
    </div>

    <div class="config-item checkbox-label">
      <input type="checkbox" id="animacoes" checked />
      <label for="animacoes" style="margin:0;">Ativar animações</label>
    </div>

    <div class="buttons">
      <button id="btnSalvar">Salvar</button>
      <button id="btnResetar" class="reset-btn">Resetar</button>
    </div>
  </div>

  <script>
       document.addEventListener("DOMContentLoaded", () => {
        const perfilUsuario = document.getElementById("perfil-usuario");
        const miniNavbar = document.getElementById("mini-navbar");

        perfilUsuario.addEventListener("click", (e) => {
            e.stopPropagation();
            miniNavbar.style.display = (miniNavbar.style.display === "block") ? "none" : "block";
        });

        document.addEventListener("click", (e) => {
            if (!miniNavbar.contains(e.target) && e.target !== perfilUsuario && !perfilUsuario.contains(e.target)) {
                miniNavbar.style.display = "none";
            }
        });

        const linksMiniNavbar = miniNavbar.querySelectorAll("a");
        linksMiniNavbar.forEach(link => {
            link.addEventListener("click", () => {
                miniNavbar.style.display = "none";
            });
        });
      });
    function atualizarValor(idInput, idDisplay, unit = '') {
      const input = document.getElementById(idInput);
      const display = document.getElementById(idDisplay);
      display.textContent = input.value + unit;
      input.addEventListener('input', () => {
        display.textContent = input.value + unit;
      });
    }

    atualizarValor('tamanhoFonte', 'tamanhoFonteVal', ' px');
    atualizarValor('brilho', 'brilhoVal', '%');

    function salvarConfiguracoes() {
      const config = {
        modo: document.getElementById('modo').value,
        fonte: document.getElementById('fonte').value,
        tamanhoFonte: document.getElementById('tamanhoFonte').value,
        brilho: document.getElementById('brilho').value,
        corPrimaria: document.getElementById('corPrimaria').value,
        animacoes: document.getElementById('animacoes').checked,
      };
      localStorage.setItem('configuracoesSite', JSON.stringify(config));
      alert('Configurações salvas!');
    }

    function carregarConfiguracoes() {
      const config = JSON.parse(localStorage.getItem('configuracoesSite'));
      if (!config) return;

      document.getElementById('modo').value = config.modo || 'claro';
      document.getElementById('fonte').value = config.fonte || 'Arial';
      document.getElementById('tamanhoFonte').value = config.tamanhoFonte || 15;
      document.getElementById('brilho').value = config.brilho || 100;
      document.getElementById('corPrimaria').value = config.corPrimaria || '#0078d7';
      document.getElementById('animacoes').checked = config.animacoes !== undefined ? config.animacoes : true;

      document.getElementById('tamanhoFonteVal').textContent = config.tamanhoFonte + ' px';
      document.getElementById('brilhoVal').textContent = config.brilho + '%';
    }

    function resetarConfiguracoes() {
      if (!confirm('Deseja realmente resetar as configurações para o padrão?')) return;

      localStorage.removeItem('configuracoesSite');
      carregarConfiguracoes();
      alert('Configurações resetadas para padrão!');
    }

    document.getElementById('btnSalvar').addEventListener('click', salvarConfiguracoes);
    document.getElementById('btnResetar').addEventListener('click', resetarConfiguracoes);

    carregarConfiguracoes();
  </script>
