<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cadastro de Animal</title>
  <link rel="shortcut icon" href="Images/Adopt 500x500.png" type="image/x-icon" />
  <style>
    /* Styles for Upload Page - Modern Blue Theme */

    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');
.logout-button {
  position: fixed;
  top: 20px;
  left: 20px;
  width: 40px;
  height: 40px;
  cursor: pointer;
  transition: transform 0.2s ease;
  z-index: 999;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
}


.logout-button:hover {
  transform: scale(1.1);
}

.logout-icon {
  width: 100%;
  height: auto;
}
    body {
        font-family: 'Inter', sans-serif;
        background-color: #1e3a5f;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background: linear-gradient(135deg, #1e3a5f, #2a5298);
    }

    .container {
        background-color: #324a7a;
        padding: 30px;
        box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
        border-radius: 15px;
        width: 350px;
        transition: transform 0.2s ease;
    }

    .container:hover {
        transform: scale(1.01);
    }

    .logo {
        display: block;
        margin: 0 auto 20px;
        max-width: 75px;
        height: auto;
    }

    .cadastro-title {
        color: #ffffff;
        margin-bottom: 25px;
        font-weight: 500;
        text-align: center;
    }

    h2 {
        color: #ffffff;
        margin-bottom: 15px;
        font-weight: 500;
        text-align: left;
    }

    form {
        display: flex;
        flex-direction: column;
    }

    label {
        margin-bottom: 5px;
        color: #dbe3f0;
    }

    input[type="file"],
    input[type="text"],
    input[type="date"],
    select,
    textarea {
        padding: 12px;
        margin-bottom: 20px;
        border: 1px solid #5a6e96;
        border-radius: 8px;
        font-size: 15px;
        background-color: #3e577e;
        color: #ffffff;
        outline: none;
        transition: border 0.3s ease;
    }

    input[type="file"]:focus,
    input[type="text"]:focus,
    input[type="date"]:focus,
    select:focus,
    textarea:focus {
        border: 1px solid #1e90ff;
    }

    input::placeholder,
    textarea::placeholder {
        color: #a9b2c3;
    }

    input[type="submit"] {
        background-color: #1e90ff;
        color: white;
        padding: 12px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        transition: background-color 0.3s ease;
    }

    input[type="submit"]:hover {
        background-color: #1c86ee;
    }

    #preview {
        margin: 15px 0;
        border: 1px solid #5a6e96;
        border-radius: 8px;
        max-width: 100%;
        display: none;
    }

    #mensagem {
        margin-bottom: 20px;
        text-align: center;
        font-weight: bold;
    }
  </style>
  <a href="catalogo.html" class="logout-button">
        <img src="images/sair.png" alt="Voltar" class="logout-icon" />
    </a>
</head>
<body>
  <div class="container">
    <a href="catalogo.html">
      <img src="Images/Adopt 75x75.png" alt="Logo Adopetz" class="logo" />
       
        
    </a>
    
    
    <h2 class="cadastro-title">Cadastro de Animal</h2>

    <div id="mensagem"></div>

    <form id="form-cadastro" enctype="multipart/form-data" novalidate>
      <label for="foto">Selecione a Foto:</label>
      <input type="file" id="foto" name="foto" accept="image/*" required />

      <label for="anuncioNome">Nome do Anúncio:</label>
      <input
        type="text"
        id="anuncioNome"
        name="anuncioNome"
        placeholder="Nome do Anúncio"
        required
      />

      <label for="descricao">Descrição:</label>
      <textarea
        id="descricao"
        name="descricao"
        placeholder="Descrição"
        required
      ></textarea>

      <label for="raca">Raça:</label>
      <input
        type="text"
        id="raca"
        name="raca"
        placeholder="Raça"
        required
      />

      <label for="dataNascimento">Data de Nascimento:</label>
      <input type="date" id="dataNascimento" name="dataNascimento" required />

      <label for="vacinado">Vacinado:</label>
      <select id="vacinado" name="vacinado" required>
        <option value="Sim">Sim</option>
        <option value="Não">Não</option>
      </select>

      <label for="coloracao">Coloração:</label>
      <input
        type="text"
        id="coloracao"
        name="coloracao"
        placeholder="Coloração"
        required
      />

      <!-- NOVOS CAMPOS -->
      <label for="localidade">Localidade:</label>
      <select id="localidade" name="localidade" required>
        <option value="">Selecione a localidade</option>
        <option value="SP">São Paulo (SP)</option>
        <option value="RJ">Rio de Janeiro (RJ)</option>
        <option value="MG">Minas Gerais (MG)</option>
      </select>

      <label for="tipo">Tipo de Animal:</label>
      <select id="tipo" name="tipo" required>
        <option value="">Selecione o tipo</option>
        <option value="Cachorro">Cachorro</option>
        <option value="Gato">Gato</option>
        <option value="Outros">Outros</option>
      </select>

      <img id="preview" alt="Pré-visualização da imagem" />

      <input type="submit" value="Cadastrar Animal" />
    </form>
  </div>

  <script>
    const fotoInput = document.getElementById('foto');
    const previewImg = document.getElementById('preview');
    const form = document.getElementById('form-cadastro');
    const mensagemDiv = document.getElementById('mensagem');

    fotoInput.addEventListener('change', function () {
      const file = this.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function (e) {
          previewImg.src = e.target.result;
          previewImg.style.display = 'block';
        };
        reader.readAsDataURL(file);
      } else {
        previewImg.src = '';
        previewImg.style.display = 'none';
      }
    });

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      const anuncio = {
        nome: form.anuncioNome.value.trim(),
        descricao: form.descricao.value.trim(),
        raca: form.raca.value.trim(),
        dataNascimento: form.dataNascimento.value,
        vacinado: form.vacinado.value,
        coloracao: form.coloracao.value.trim(),
        idade: calcularIdade(form.dataNascimento.value),
        porte: 'Desconhecido',
        imagem: previewImg.src,
        localidade: form.localidade.value,
        tipo: form.tipo.value
      };

      if (!anuncio.imagem) {
        mensagemDiv.textContent = 'Por favor, selecione uma imagem válida.';
        mensagemDiv.style.color = 'red';
        return;
      }

      const anuncios = JSON.parse(localStorage.getItem('anuncios')) || [];
      anuncios.push(anuncio);
      localStorage.setItem('anuncios', JSON.stringify(anuncios));

      mensagemDiv.textContent = 'Anúncio cadastrado com sucesso!';
      mensagemDiv.style.color = 'lightgreen';

      form.reset();
      previewImg.style.display = 'none';

      setTimeout(() => {
        window.location.href = 'homelogada.html'; // Ajuste para sua página inicial
      }, 1500);
    });

    function calcularIdade(dataNascimento) {
      if (!dataNascimento) return 0;
      const hoje = new Date();
      const nascimento = new Date(dataNascimento);
      let idade = hoje.getFullYear() - nascimento.getFullYear();
      const m = hoje.getMonth() - nascimento.getMonth();
      if (m < 0 || (m === 0 && hoje.getDate() < nascimento.getDate())) {
        idade--;
      }
      return idade;
    }
  </script>
</body>
</html>
