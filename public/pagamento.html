    body {
      font-family: 'Inter', sans-serif;
      background: #f2f6fc;
      margin: 0;
      padding: 0;
      color: #1e3a5f;

    .container {
      max-width: 600px;
      margin: 60px auto;
      padding: 30px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);

    h2 {
      text-align: center;
      margin-bottom: 30px;
      color: #1e90ff;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }
    input:disabled {
      background-color: #f0f0f0;
    }
    .btn-pagar {
      width: 100%;
      padding: 14px;
      background: #1e90ff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-pagar:hover {
      background: #156ecf;
    }
    .mensagem-erro {
      color: #d93025;
      font-weight: bold;
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>
<body>

            <div class="perfil-usuario" id="perfil-usuario">

  <div class="container">
    <h2>Pagamento</h2>
    <form id="form-pagamento" onsubmit="return processarPagamento(event)">
      <label for="cpf">CPF:</label>
      <input type="text" id="cpf" required oninput="verificarCPF()" placeholder="000.000.000-00">

      <div id="dados-cartao" style="display: none;">
        <label for="numero-cartao">Número do Cartão:</label>
        <input type="text" id="numero-cartao" placeholder="0000 0000 0000 0000" required>

        <label for="validade">Validade:</label>
        <input type="month" id="validade" required>

        <label for="cvv">CVV:</label>
        <input type="text" id="cvv" placeholder="123" required>

        <label for="parcelas">Parcelamento:</label>
        <select id="parcelas" required>
          <option value="">Escolha</option>
          <option value="1">1x sem juros</option>
          <option value="2">2x sem juros</option>
          <option value="3">3x sem juros</option>
          <option value="4">4x sem juros</option>
        </select>
      </div>

      <button class="btn-pagar" type="submit">Pagar</button>
    </form>
    <div class="mensagem-erro" id="mensagem-erro"></div>
  </div>

  <script>
    function verificarCPF() {
      const cpf = document.getElementById('cpf').value;
      const dadosCartao = document.getElementById('dados-cartao');
      if (cpf.length >= 11) {
        dadosCartao.style.display = 'block';
      } else {
        dadosCartao.style.display = 'none';
      }
    }

    function processarPagamento(e) {
      e.preventDefault();
      document.getElementById('mensagem-erro').textContent = 'Erro ao processar pagamento. Entre em contato com o operador do cartão.';
      return false;
    }
  </script>
</body>
