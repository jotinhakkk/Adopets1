<!-- Legenda/Filtro -->
<div class="legenda" id="filtros">
  <div class="item-legenda ativo" data-tipo="ong">
    <img src="https://cdn-icons-png.flaticon.com/512/616/616408.png" alt=""> ONG
  </div>
  <div class="item-legenda ativo" data-tipo="petshop">
    <img src="https://cdn-icons-png.flaticon.com/512/2839/2839868.png" alt=""> Petshop
  </div>
  <div class="item-legenda ativo" data-tipo="vet">
    <img src="https://cdn-icons-png.flaticon.com/512/9184/9184277.png" alt=""> Veterinário
  </div>
  <div class="item-legenda ativo" data-tipo="pessoa">
    <img src="https://cdn-icons-png.flaticon.com/512/1077/1077063.png" alt=""> Pessoa Doando
  </div>
</div>

<script>
/* -------- Configuração geral -------- */
const BBOX   = [-22.98, -43.25, -22.85, -43.10]; // S W N E
const CENTER = [-22.93, -43.18];
const OVERPASS = "https://overpass-api.de/api/interpreter";
const Q_TIMEOUT = 25;

/* Ícones */
const icones = {
  ong     : L.icon({iconUrl:'https://cdn-icons-png.flaticon.com/512/616/616408.png',  iconSize:[30,30]}),
  petshop : L.icon({iconUrl:'https://cdn-icons-png.flaticon.com/512/2839/2839868.png', iconSize:[30,30]}),
  vet     : L.icon({iconUrl:'https://cdn-icons-png.flaticon.com/512/9184/9184277.png', iconSize:[30,30]}),
  pessoa  : L.icon({iconUrl:'https://cdn-icons-png.flaticon.com/512/1077/1077063.png', iconSize:[30,30]})
};

/* Mapa */
const map = L.map('map').setView(CENTER, 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);

/* Layers por categoria (com Cluster) */
const categorias = ['ong','petshop','vet','pessoa'];
const grupos = {};
categorias.forEach(tp=>{
  grupos[tp] = L.markerClusterGroup({maxClusterRadius:60});
  map.addLayer(grupos[tp]);
});

/* Consulta Overpass */
async function consultaOverpass(q){
  const url = `${OVERPASS}?data=[out:json][timeout:${Q_TIMEOUT}];${q};out center;`;
  const r = await fetch(url);
  if(!r.ok) throw new Error('Overpass erro');
  return (await r.json()).elements;
}

/* Adiciona marcador */
function addMarker(lat,lng,icon,popup,categ){
  const m = L.marker([lat,lng],{icon}).bindPopup(popup);
  grupos[categ].addLayer(m);
}

/* Carrega dados reais + ONGs fixas */
async function carregarDados(){
  // Petshops
  const pet = await consultaOverpass(`node["shop"="pet"](${BBOX.join(',')})`);
  pet.forEach(p=> addMarker(p.lat,p.lon,icones.petshop,`<b>${p.tags.name||'Petshop'}</b>`,'petshop'));

  // Veterinários
  const vet = await consultaOverpass(`node["amenity"="veterinary"](${BBOX.join(',')})`);
  vet.forEach(v=> addMarker(v.lat,v.lon,icones.vet,`<b>${v.tags.name||'Clínica Veterinária'}</b>`,'vet'));

  // ONGs fixas (exemplo)
  [
    {lat:-22.9141,lng:-43.1968,nome:"Instituto Vida Animal"},
    {lat:-22.9234,lng:-43.2351,nome:"ONG Amigo Fiel"}
  ].forEach(o=> addMarker(o.lat,o.lng,icones.ong,`<b>${o.nome}</b>`,'ong'));

  // Depois de carregar bases, adiciona pessoas doando
  adicionarDoadoresProximos(8);

  ajustarVisibilidade();
}

/* Gera doadores próximos de um ponto real, evitando mar (lng > -43.19) */
function adicionarDoadoresProximos(qtd){
  const baseMarkers = [];
  ['petshop','vet','ong'].forEach(tp=>{
    grupos[tp].eachLayer(m=>baseMarkers.push(m.getLatLng()));
  });
  if(baseMarkers.length===0) return;

  const nomes  = ["Maria","João","Carla","Pedro","Ana","Luiz","Patrícia","Ricardo"];
  const itens  = ["ração","cobertor","areia","brinquedos","petiscos"];

  let criados=0, tentativas=0;
  while(criados<qtd && tentativas<qtd*10){
    tentativas++;
    const base = baseMarkers[Math.floor(Math.random()*baseMarkers.length)];
    // deslocamento dentro de ~200‑300 m
    const lat = base.lat + (Math.random()-0.5)*0.003;
    const lng = base.lng + (Math.random()-0.5)*0.003;

    // dentro do bbox e fora do mar simples
    if(lat<BBOX[0]||lat>BBOX[2]||lng<BBOX[1]||lng>BBOX[3]||lng<-43.19) continue;

    const nome  = nomes[Math.floor(Math.random()*nomes.length)];
    const item  = itens[Math.floor(Math.random()*itens.length)];
    addMarker(lat,lng,icones.pessoa,`<b>${nome}</b><br>Doando ${item}`, 'pessoa');
    criados++;
  }
}

/* Filtro (mostrar/ocultar categorias) */
function ajustarVisibilidade(){
  categorias.forEach(tp=>{
    if(document.querySelector(`.item-legenda[data-tipo="${tp}"]`).classList.contains('ativo')){
      map.addLayer(grupos[tp]);
    }else{
      map.removeLayer(grupos[tp]);
    }
  });
}

/* Eventos de clique legenda */
document.querySelectorAll('.item-legenda').forEach(el=>{
  el.addEventListener('click',()=>{
    el.classList.toggle('ativo');
    ajustarVisibilidade();
  });
});

/* Inicializa */
carregarDados().catch(console.error);
</script>
