<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat</title>
    <link rel="stylesheet" href="css/chats.css" />
    <style>
        /* Adicione estilos básicos para as mensagens */
        .message {
            padding: 8px 12px;
            margin: 6px 0;
            border-radius: 12px;
            max-width: 70%;
            word-wrap: break-word;
            font-size: 14px;
            position: relative;
        }
        .message.sent {
            background-color: #1e90ff;
            color: white;
            align-self: flex-end;
        }
        .message.received {
            background-color: #ddd;
            color: #333;
            align-self: flex-start;
        }
        .timestamp {
            font-size: 10px;
            color: #666;
            margin-top: 2px;
            text-align: right;
        }
        #messagesContainer {
            display: flex;
            flex-direction: column;
            height: 350px;
            overflow-y: auto;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
        /* Outras estilizações, se precisar, podem continuar */
    </style>
    
</head>
<body>
    <a href="catalogo.html" class="logout-button">
        <img src="images/sair.png" alt="Voltar" class="logout-icon" />
    </a>

    <div class="chat-container">
        <div class="chat-list">
            <h2>Conversas</h2>
            <ul id="chatList"></ul>
        </div>

        <div class="chat-box">
            <div id="chatHeader" class="chat-header">
                <img id="animalImage" src="" alt="Imagem do Animal" class="animal-img" />
                <h3 id="chatTitle"></h3>
                
            </div>

            <div id="messagesContainer" class="messages-container">
                <!-- Mensagens serão adicionadas aqui -->
            </div>

            <div class="message-input">
                <input type="text" id="messageInput" placeholder="Digite sua mensagem..." />
                <button id="sendButton">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const chatList = document.getElementById("chatList");
            const chatTitle = document.getElementById("chatTitle");
            const animalImage = document.getElementById("animalImage");
            const messagesContainer = document.getElementById("messagesContainer");
            const sendButton = document.getElementById("sendButton");
            const messageInput = document.getElementById("messageInput");

            const anuncios = JSON.parse(localStorage.getItem("anuncios")) || [];
            let chatAtivo = null;
            let mensagens = {};

            // Inicializa mensagens do localStorage
            if (localStorage.getItem("mensagens")) {
                mensagens = JSON.parse(localStorage.getItem("mensagens"));
            }

            // Preenche a lista de chats
            anuncios.forEach((animal, index) => {
                const li = document.createElement("li");
                li.innerHTML = `
                    <img src="${animal.imagem}" alt="${animal.nome}">
                    <div>${animal.nome}</div>
                `;
                li.style.cursor = 'pointer';
                li.addEventListener("click", () => carregarChat(index));
                chatList.appendChild(li);
            });

            function carregarChat(index) {
                chatAtivo = index;
                const animal = anuncios[index];
                chatTitle.textContent = animal.nome;
                animalImage.src = animal.imagem;

                atualizarMensagens();
            }

            function formatarDataHora(timestamp) {
                const d = new Date(timestamp);
                return d.toLocaleString('pt-BR', {
                    day: '2-digit', month: '2-digit', year: 'numeric',
                    hour: '2-digit', minute: '2-digit'
                });
            }

            function atualizarMensagens() {
                messagesContainer.innerHTML = "";
                const lista = mensagens[chatAtivo] || [];

                lista.forEach(msg => {
                    const div = document.createElement("div");
                    div.className = `message ${msg.tipo}`;

                    // Conteúdo da mensagem
                    div.textContent = msg.texto;

                    // Elemento para timestamp
                    const spanTime = document.createElement("div");
                    spanTime.className = "timestamp";
                    spanTime.textContent = formatarDataHora(msg.timestamp);

                    div.appendChild(spanTime);
                    messagesContainer.appendChild(div);
                });
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }

            sendButton.addEventListener("click", () => {
                if (chatAtivo === null) return;
                const texto = messageInput.value.trim();
                if (!texto) return;

                mensagens[chatAtivo] = mensagens[chatAtivo] || [];
                mensagens[chatAtivo].push({
                    tipo: "sent",
                    texto,
                    timestamp: Date.now()
                });

                localStorage.setItem("mensagens", JSON.stringify(mensagens));
                messageInput.value = "";
                atualizarMensagens();
            });

            // Exemplo de evento para concluir adoção
            document.getElementById("finalizarVenda").addEventListener("click", () => {
                if (chatAtivo === null) return;
                alert("Adoção concluída com sucesso para: " + anuncios[chatAtivo].nome);
            });
        });
    </script>
</body>
</html>
